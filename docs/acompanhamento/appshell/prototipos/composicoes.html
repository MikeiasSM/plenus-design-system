/* ================= Eventos do conteúdo ================= */
function fixarPadrao(form) {
  [...form.elements].forEach((el) => {
    if (el.type === 'checkbox') el.defaultChecked = el.checked;
    else if (el.tagName === 'SELECT') [...el.options].forEach((o) => { o.defaultSelected = o.selected; });
    else el.defaultValue = el.value;
  });
}
let temporizadorRascunho = null;
function registrarRascunho() {
  const alvo = document.querySelector('#rascunho-txt span');
  if (!alvo) return;
  alvo.textContent = 'Salvando rascunho…';
  clearTimeout(temporizadorRascunho);
  temporizadorRascunho = setTimeout(() => {
    const t = document.querySelector('#rascunho-txt span');
    if (t) t.textContent = `Rascunho salvo às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
  }, 900);
}

corpoPagina.addEventListener('input', (e) => {
  const alvo = e.target;
  if (alvo.id === 'buscar-config') {
    const termo = alvo.value.trim().toLowerCase();
    let algum = false;
    document.querySelectorAll('[data-grupo]').forEach((g) => {
      let visiveis = 0;
      g.querySelectorAll('li').forEach((li) => { const ok = li.dataset.busca.includes(termo); li.hidden = !ok; if (ok) visiveis++; });
      g.hidden = visiveis === 0;
      if (visiveis) algum = true;
    });
    $('#sem-resultado').hidden = algum;
    return;
  }
  if (alvo.id === 'ped-busca') {
    Object.assign(estado.pedidos, { busca: alvo.value.trim().toLowerCase(), pagina: 1 });
    pintarPedidos();
    return;
  }
  if (alvo.closest('#form-pedido')) recalcularPedido();
  if (alvo.closest('#form-cliente')) registrarRascunho();
  if (alvo.closest('[data-formulario]') && rotaAtual().savebar && !estado.sujo) { estado.sujo = true; sincronizarSavebar(); }
  marcarPendente(alvo.closest('form[data-salvavel]'), true);
});

corpoPagina.addEventListener('change', (e) => {
  const alvo = e.target;
  if (alvo.matches('[data-sel]')) {
    const n = Number(alvo.dataset.sel);
    if (alvo.checked) estado.pedidos.sel.add(n); else estado.pedidos.sel.delete(n);
    pintarPedidos();
    document.querySelector(`[data-sel="${n}"]`)?.focus();
    return;
  }
  if (alvo.matches('[data-sel-todas]')) {
    document.querySelectorAll('[data-sel]').forEach((c) => { const n = Number(c.dataset.sel); if (alvo.checked) estado.pedidos.sel.add(n); else estado.pedidos.sel.delete(n); });
    pintarPedidos();
    document.querySelector('[data-sel-todas]')?.focus();
    return;
  }
  if (alvo.matches('[data-aceitar]')) {
    const i = Number(alvo.dataset.aceitar);
    if (alvo.checked) estado.conc.aceitos.add(i); else estado.conc.aceitos.delete(i);
    desenharPagina();
    document.querySelector(`[data-aceitar="${i}"]`)?.focus();
    return;
  }
  if (alvo.id === 'c-conta') { estado.conc.conta = alvo.value; return; }
  if (alvo.closest('#form-pedido')) recalcularPedido();
  if (alvo.closest('[data-formulario]') && rotaAtual().savebar && !estado.sujo) { estado.sujo = true; sincronizarSavebar(); }
  marcarPendente(alvo.closest('form[data-salvavel]'), true);
});

corpoPagina.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'form-comentario') {
    const texto = $('#comentario').value.trim();
    if (!texto) { $('#comentario').focus(); return; }
    (estado.comentarios[estado.pedidoAtual] ??= []).unshift({ quando: 'agora', autor: 'Suporte', coment: texto });
    desenharPagina();
    mostrarToast('Comentário adicionado');
    $('#comentario').focus();
    return;
  }
  if (f.matches('[data-salvavel]')) { fixarPadrao(f); marcarPendente(f, false, 'Salvo agora'); }
});
corpoPagina.addEventListener('reset', (e) => setTimeout(() => marcarPendente(e.target, false), 0));

corpoPagina.addEventListener('keydown', (e) => {
  const aba = e.target.closest('[role="tab"]');
  if (aba) {
    const idx = VISOES.findIndex(([k]) => k === estado.pedidos.visao);
    const destino = { ArrowRight: idx + 1, ArrowLeft: idx - 1, Home: 0, End: VISOES.length - 1 }[e.key];
    if (destino === undefined) return;
    e.preventDefault();
    trocarVisao(VISOES[(destino + VISOES.length) % VISOES.length][0], true);
    return;
  }
  if (!e.target.matches('[data-nova]')) return;
  if (e.key === 'Escape') { e.stopPropagation(); estado.linhaNova = false; desenharPagina(); $('#btn-linha').focus(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const valor = (n) => document.querySelector(`[data-nova="${n}"]`).value.trim();
  if (!valor('descricao')) { document.querySelector('[data-nova="descricao"]').setAttribute('aria-invalid', 'true'); mostrarToast('Informe a descrição'); document.querySelector('[data-nova="descricao"]').focus(); return; }
  incluirProduto({ sku: valor('sku'), descricao: valor('descricao'), un: valor('un'), preco: valor('preco'), estoque: valor('estoque') });
  desenharPagina();
  document.querySelector('[data-nova="descricao"]').focus();
  mostrarToast('Produto adicionado. Digite o próximo.');
});

function trocarVisao(v, foco = false) {
  Object.assign(estado.pedidos, { visao: v, pagina: 1 });
  estado.pedidos.sel.clear();
  pintarPedidos({ comEsqueleto: true });
  if (foco) document.getElementById(`aba-${v}`).focus();
}

corpoPagina.addEventListener('scroll', () => {
  fecharPopover(false);
  const links = document.querySelectorAll('[data-toc]');
  if (!links.length) return;
  const topo = corpoPagina.getBoundingClientRect().top + 80;
  let atualId = links[0].dataset.toc;
  links.forEach((l) => { if (document.getElementById(l.dataset.toc).getBoundingClientRect().top <= topo) atualId = l.dataset.toc; });
  links.forEach((l) => l.setAttribute('aria-current', String(l.dataset.toc === atualId)));
});

function avancarEtapa(delta) {
  estado.conc.etapa = Math.max(0, Math.min(ETAPAS.length - 1, estado.conc.etapa + delta));
  desenharPagina();
  corpoPagina.scrollTop = 0;
  document.querySelector('.step[aria-current]')?.focus();
}

document.addEventListener('click', (e) => {
  const t = e.target;
  const pop = t.closest('[data-pop]');
  if (estado.popover && !t.closest('#popover') && !pop) fecharPopover(false);
  if (pop) {
    if (estado.popover?.nome === pop.dataset.pop) fecharPopover(); else abrirPopover(pop.dataset.pop, pop);
    return;
  }
  if (t.closest('[data-fechar-popover]')) { fecharPopover(); return; }
  if (t.closest('[data-fechar-dialogo]')) { fecharDialogo(); return; }
  const aviso = t.closest('[data-toast]');
  if (aviso) { mostrarToast(aviso.dataset.toast); if (estado.popover) fecharPopover(); return; }

  const destino = t.closest('[data-rota]');
  if (destino) {
    e.preventDefault();
    ir(destino.dataset.rota, destino.dataset.param ?? null);
    if (destino.closest('#itens')) $('#itens [aria-current="page"]')?.focus();
    return;
  }
  const linha = t.closest('tr[data-linha]');
  if (linha && !t.closest('input, a, button')) { ir('pedido', linha.dataset.linha); return; }

  const visao = t.closest('[data-visao]');
  if (visao) { trocarVisao(visao.dataset.visao); document.getElementById(`aba-${visao.dataset.visao}`).focus(); return; }
  const ordenar = t.closest('[data-ordenar]');
  if (ordenar) {
    const o = estado.pedidos.ordem, col = ordenar.dataset.ordenar;
    estado.pedidos.ordem = { col, dir: o.col === col && o.dir === 'asc' ? 'desc' : 'asc' };
    pintarPedidos();
    document.querySelector(`[data-ordenar="${col}"]`).focus();
    return;
  }
  const pagina = t.closest('[data-pagina]');
  if (pagina && !pagina.disabled) {
    estado.pedidos.pagina = Number(pagina.dataset.pagina);
    pintarPedidos();
    document.querySelector(`.pag [data-numero][data-pagina="${estado.pedidos.pagina}"]`)?.focus();
    return;
  }
  const lote = t.closest('[data-lote]');
  if (lote) {
    const acao = lote.dataset.lote, sel = estado.pedidos.sel;
    if (acao === 'aprovar') {
      const aprovados = PEDIDOS.filter((p) => sel.has(p.numero) && p.sit === 'aprovacao');
      aprovados.forEach((p) => { p.sit = 'separacao'; });
      mostrarToast(aprovados.length ? `${aprovados.length} ${aprovados.length === 1 ? 'pedido aprovado' : 'pedidos aprovados'}` : 'Nenhum dos selecionados aguardava aprovação');
    } else if (acao === 'exportar') mostrarToast(`Exemplo: exportaria ${sel.size} pedidos.`);
    sel.clear();
    pintarPedidos();
    return;
  }
  if (t.closest('[data-limpar-tudo]')) {
    Object.assign(estado.pedidos, { busca: '', pagina: 1, filtro: { situacao: '', vendedor: '' } });
    $('#ped-busca').value = '';
    pintarPedidos();
    return;
  }
  if (t.closest('[data-acao-pedido]')) {
    const p = PEDIDOS.find((x) => x.numero === estado.pedidoAtual);
    const proxima = { aprovacao: ['separacao', 'Aprovado por Suporte'], separacao: ['entregue', 'Separação concluída e entregue'] }[p.sit];
    if (!proxima) { mostrarToast(`Exemplo: executaria "${ROTULO_ACAO[p.sit]}".`); return; }
    p.sit = proxima[0];
    (estado.comentarios[p.numero] ??= []).unshift({ quando: 'agora', txt: proxima[1] });
    desenharPagina();
    mostrarToast(proxima[1]);
    document.querySelector('[data-acao-pedido]').focus();
    return;
  }
  if (t.closest('#np-add')) {
    $('#np-itens').insertAdjacentHTML('beforeend', linhaItemPedido(1, 1));
    recalcularPedido();
    estado.sujo = true; sincronizarSavebar();
    $('#np-itens tr:last-child [data-prod]').focus();
    return;
  }
  const remover = t.closest('[data-remover-item]');
  if (remover) {
    if (document.querySelectorAll('#np-itens [data-item]').length > 1) { remover.closest('tr').remove(); recalcularPedido(); estado.sujo = true; sincronizarSavebar(); $('#np-add').focus(); }
    return;
  }
  if (t.closest('#sb-salvar')) { salvarNovoPedido(); return; }
  if (t.closest('#sb-descartar')) { estado.sujo = false; desenharPagina(); sincronizarSavebar(); mostrarToast('Alterações descartadas'); return; }
  if (t.closest('#salvar-cliente')) {
    if (!$('#nc-razao').value.trim()) { invalidar('nc-razao', 'Informe o nome ou a razão social'); return; }
    mostrarToast('Cliente salvo'); ir('clientes-base');
    return;
  }
  const tipo = t.closest('[data-tipo]');
  if (tipo) {
    estado.tipoPessoa = tipo.dataset.tipo;
    const pj = estado.tipoPessoa === 'PJ';
    document.querySelectorAll('[data-tipo]').forEach((b) => b.setAttribute('aria-pressed', String(b === tipo)));
    const rotulos = { 'nc-doc': pj ? 'CNPJ' : 'CPF', 'nc-ie': pj ? 'Inscrição estadual' : 'RG', 'nc-razao': pj ? 'Razão social' : 'Nome completo', 'nc-fantasia': pj ? 'Nome fantasia' : 'Apelido' };
    Object.entries(rotulos).forEach(([id, txt]) => { document.querySelector(`label[for="${id}"]`).firstChild.textContent = txt; });
    registrarRascunho();
    return;
  }
  const depVisao = t.closest('[data-dep-visao]');
  if (depVisao) { estado.depVisao = depVisao.dataset.depVisao; desenharPagina(); document.querySelector(`[data-dep-visao="${estado.depVisao}"]`).focus(); return; }
  if (t.closest('[data-novo-deposito]')) { dialogoNovoDeposito(); return; }
  if (t.closest('[data-novo-produto]')) { dialogoNovoProduto(); return; }
  if (t.closest('[data-nova-conta]')) { dialogoNovaConta(); return; }
  if (t.closest('[data-linha-nova]')) {
    estado.linhaNova = !estado.linhaNova;
    desenharPagina();
    if (estado.linhaNova) document.querySelector('[data-nova="descricao"]').focus(); else $('#btn-linha').focus();
    return;
  }
  if (t.closest('[data-fechar-linha]')) { estado.linhaNova = false; desenharPagina(); $('#btn-linha').focus(); return; }

  if (t.closest('[data-escolher-arquivo]')) { estado.conc.arquivo = 'extrato-outubro-2026.ofx'; desenharPagina(); return; }
  if (t.closest('[data-conc-manual]')) { estado.conc.arquivo = 'manual'; desenharPagina(); return; }
  if (t.closest('[data-conc-proximo]')) { avancarEtapa(1); return; }
  if (t.closest('[data-conc-voltar]')) { avancarEtapa(-1); return; }
  const etapa = t.closest('[data-etapa]');
  if (etapa) { estado.conc.etapa = Number(etapa.dataset.etapa); desenharPagina(); return; }
  if (t.closest('[data-conc-concluir]')) { estado.conc.concluida = true; desenharPagina(); mostrarToast('Conciliação concluída'); return; }
  if (t.closest('[data-conc-sair]')) { mostrarToast('Progresso salvo. Continue de onde parou.'); ir('inicio'); return; }
  if (t.closest('[data-conc-reiniciar]')) { estado.conc = { etapa: 0, conta: estado.conc.conta, arquivo: null, aceitos: new Set(), concluida: false }; desenharPagina(); return; }

  const remPessoa = t.closest('[data-remover]');
  if (remPessoa) { remPessoa.closest('.pessoa').remove(); return; }
  const toc = t.closest('[data-toc]');
  if (toc) {
    e.preventDefault();
    const alvo = document.getElementById(toc.dataset.toc);
    const suave = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    corpoPagina.scrollTo({ top: alvo.offsetTop - corpoPagina.offsetTop - 12, behavior: suave ? 'smooth' : 'auto' });
  }
});

$('#popover').addEventListener('submit', (e) => {
  e.preventDefault();
  const desc = $('#r-desc').value.trim();
  if (!desc) { invalidar('r-desc', 'Informe a descrição'); return; }
  incluirProduto({ descricao: desc, un: $('#r-un').value, preco: $('#r-preco').value });
  fecharPopover(false);
  mostrarToast('Produto criado');
  desenharPagina();
});
$('#popover').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.stopPropagation(); fecharPopover(); return; }
  const itens = [...e.currentTarget.querySelectorAll('[role="menuitem"]')];
  if (!itens.length || !['ArrowDown', 'ArrowUp'].includes(e.key)) return;
  e.preventDefault();
  const i = itens.indexOf(document.activeElement);
  itens[(i + (e.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length].focus();
});

$('#arranjo').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  estado.arranjo = b.dataset.v;
  $('#arranjo').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  desenharPagina();
  corpoPagina.scrollTop = 0;
});

/* ================= Moldura ================= */
function fecharGavetas(foco) {
  const voltar = estado.menu ? '#menu' : estado.filtros ? '#abrir-filtros' : null;
  estado.menu = false;
  if (estreito()) estado.filtros = false;
  aplicar({ conteudo: false });
  if (foco !== false && voltar) $(voltar).focus();
}

function abrirConta(abrir) {
  estado.conta = abrir;
  aplicar({ conteudo: false });
  if (abrir) setTimeout(() => $('#conta .item')?.focus(), 60);
  else $('#conta-trigger').focus();
}

shell.addEventListener('click', (e) => {
  if (e.target.closest('#conta-trigger')) { abrirConta(!estado.conta); return; }
  if (e.target.closest('#rail-conta')) {
    estado.aberto = true;
    if (estreito()) estado.menu = true;
    abrirConta(true);
    return;
  }
  if (e.target.closest('[data-conta]')) { e.preventDefault(); abrirConta(false); return; }
  const rail = e.target.closest('[data-modulo]');
  if (rail) {
    estado.conta = false;
    const id = rail.dataset.modulo;
    if (id === estado.modulo) {
      if (!estreito()) estado.aberto = !estado.aberto;
      aplicar({ conteudo: false });
      return;
    }
    const primeiro = [...MODULOS, ...MODULOS_BASE].find((m) => m.id === id).itens[0];
    const alvo = primeiro.filhos?.[0] ?? primeiro;
    const menuAberto = estado.menu;
    ir(alvo.rota, alvo.param !== undefined ? String(alvo.param) : null);
    if (estreito() && menuAberto) { estado.menu = true; aplicar({ conteudo: false }); }
    $(`[data-modulo="${id}"]`)?.focus();
    return;
  }
  const alternar = e.target.closest('[data-alternar]');
  if (alternar) {
    const nome = alternar.dataset.alternar;
    if (estado.expandidos.has(nome)) estado.expandidos.delete(nome); else estado.expandidos.add(nome);
    aplicar({ conteudo: false });
    $(`[data-alternar="${nome}"]`).focus();
    return;
  }
  if (e.target.closest('#recolher')) {
    if (estreito()) { fecharGavetas(); return; }
    estado.aberto = false; aplicar({ conteudo: false }); $('#expandir').focus(); return;
  }
  if (e.target.closest('#expandir')) { estado.aberto = true; aplicar({ conteudo: false }); $('#recolher').focus(); return; }
  if (e.target.closest('#menu')) { estado.menu = true; estado.filtros = false; aplicar({ conteudo: false }); $('#nav .rail-btn[aria-current]')?.focus(); return; }
  if (e.target.closest('#scrim')) { fecharGavetas(); return; }
  if (e.target.closest('#abrir-filtros, [data-abrir-filtros]')) {
    estado.filtros = !estado.filtros;
    if (estado.filtros) estado.menu = false;
    aplicar({ conteudo: false });
    if (estado.filtros) $('#form-filtros select')?.focus();
    return;
  }
  if (e.target.closest('#fechar-filtros')) { estado.filtros = false; aplicar({ conteudo: false }); ($('#abrir-filtros').hidden ? document.querySelector('[data-abrir-filtros]') : $('#abrir-filtros'))?.focus(); return; }
  if (e.target.closest('#favorito')) {
    const b = $('#favorito');
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    b.querySelector('path').setAttribute('fill', b.getAttribute('aria-pressed') === 'true' ? 'currentColor' : 'none');
    return;
  }
  if (e.target.closest('#redefinir')) $('#form-filtros').reset();
  if (e.target.closest('#limpar')) $('#form-filtros').querySelectorAll('select').forEach((s) => { s.selectedIndex = 0; });
});

$('#form-filtros').addEventListener('submit', (e) => {
  e.preventDefault();
  if (estreito()) estado.filtros = false;
  if (estado.rota === 'pedidos') {
    estado.pedidos.filtro = { situacao: $('#f-situacao').value, vendedor: $('#f-vendedor').value };
    estado.pedidos.pagina = 1;
    aplicar({ conteudo: false });
    pintarPedidos({ comEsqueleto: true });
    return;
  }
  estado.periodo = $('#f-periodo').value;
  aplicar();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || e.defaultPrevented) return;
  if ($('#dialogo').open) return;
  if (estado.popover) { fecharPopover(); return; }
  if (estado.conta) { abrirConta(false); return; }
  if (estado.menu || (estreito() && estado.filtros)) fecharGavetas();
});

estreitoMq.addEventListener('change', () => { estado.menu = false; estado.filtros = false; aplicar({ conteudo: false }); });

/* Tema: segue o do navegador até a pessoa escolher no trilho */
function temaEscuro() {
  const t = document.documentElement.dataset.tema;
  if (t) return t === 'escuro';
  const v = document.documentElement.dataset.theme;
  if (v) return v === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function desenharTema() {
  const escuro = temaEscuro();
  $('#tema').setAttribute('aria-pressed', String(escuro));
  $('#tema-icone').innerHTML = ic(escuro ? 'sol' : 'lua');
}
$('#tema').addEventListener('click', () => {
  document.documentElement.dataset.tema = temaEscuro() ? 'claro' : 'escuro';
  desenharTema();
});

desenharTema();
/* Tema, entrada e atalho de demonstração (#rota+atributo) */
const [rotaInicial, atalho] = decodeURIComponent(location.hash.slice(1)).split('+');
if (TELAS[rotaInicial]) {
  estado.rota = rotaInicial;
  estado.modulo = TELAS[rotaInicial].modulo;
  if (rotaInicial === 'config-secao') { estado.param = 'Descontos e aprovação'; estado.expandidos.add('Vendas'); }
}
desenharTema();
aplicar();
if (atalho) setTimeout(() => document.querySelector(`[${atalho}]`)?.click(), 400);
</script>
