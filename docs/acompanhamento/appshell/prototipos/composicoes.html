<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Composições do AppShell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=JetBrains+Mono:wght@500&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
/* AppShell em camadas aplicado ao Painel: base, trilho e página como folhas, submenu e filtros na base. Paleta azul. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --surface-3: #E8EBEF;
  --border: #E3E5E9;
  --border-strong: #D3D7DD;
  --text: #2F3237;
  --text-2: #5F646B;
  --text-3: #90959C;
  --acc: #49619C;
  --acc-strong: #3C5184;
  --acc-hover: #F2F5FC;
  --acc-sel: #E1E7F5;
  --acc-line: #C1CDE9;
  --acc-on: #263353;
  --on-acc: #FFFFFF;
  --s1: #49619C;
  --s2: #8EA2D0;
  --s3: #C1CDE9;
  --danger: #C0392B;
  --danger-soft: #FBECEA;
  --ok: #22885B;
  --ok-soft: #E8F6EF;
  --warn: #B4761A;
  --warn-soft: #FDF3E3;
  --warn-line: #F3DDB5;
  --sh-1: 0 1px 2px rgba(24, 26, 28, .06);
  --sh-drawer: 0 20px 46px rgba(24, 26, 28, .22);
  --scrim: rgba(16, 17, 19, .38);

  --font-title: 'Poppins', system-ui, 'Segoe UI', sans-serif;
  --font-body: 'Montserrat', system-ui, 'Segoe UI', sans-serif;
  --gap: 6px;
  --radius: 8px;
  --rail: 56px;
  --panel: 232px;
  --aside: 272px;
  --speed: 220ms;
  --ease: cubic-bezier(.2, .6, .3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --surface: #1B1D20; --surface-2: #202226; --surface-3: #282B2F;
    --border: #2C2F33; --border-strong: #3A3E43;
    --text: #E9EAEB; --text-2: #A5A8AC; --text-3: #7C8085;
    --acc: #8EA2D0; --acc-strong: #A9B9DD;
    --acc-hover: color-mix(in oklab, #8EA2D0 9%, #1B1D20);
    --acc-sel: color-mix(in oklab, #8EA2D0 18%, #1B1D20);
    --acc-line: color-mix(in oklab, #8EA2D0 34%, #1B1D20);
    --acc-on: #C1CDE9; --on-acc: #101624;
    --s1: #8EA2D0; --s2: #5F77B0; --s3: #3C5184;
    --danger: #E8776B; --danger-soft: #2A1917;
    --warn: #DDA24A; --warn-soft: #2A2116; --warn-line: #4A3A22; --ok: #4FBE8B; --ok-soft: #16281F;
    --sh-1: 0 1px 2px rgba(0, 0, 0, .45); --sh-drawer: 0 20px 46px rgba(0, 0, 0, .6); --scrim: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-tema="escuro"] {
  --bg: #141517; --surface: #1B1D20; --surface-2: #202226; --surface-3: #282B2F;
  --border: #2C2F33; --border-strong: #3A3E43;
  --text: #E9EAEB; --text-2: #A5A8AC; --text-3: #7C8085;
  --acc: #8EA2D0; --acc-strong: #A9B9DD;
  --acc-hover: color-mix(in oklab, #8EA2D0 9%, #1B1D20);
  --acc-sel: color-mix(in oklab, #8EA2D0 18%, #1B1D20);
  --acc-line: color-mix(in oklab, #8EA2D0 34%, #1B1D20);
  --acc-on: #C1CDE9; --on-acc: #101624;
  --s1: #8EA2D0; --s2: #5F77B0; --s3: #3C5184;
  --danger: #E8776B; --danger-soft: #2A1917;
  --warn: #DDA24A; --warn-soft: #2A2116; --warn-line: #4A3A22; --ok: #4FBE8B; --ok-soft: #16281F;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .45); --sh-drawer: 0 20px 46px rgba(0, 0, 0, .6); --scrim: rgba(0, 0, 0, .62);
  color-scheme: dark;
}
:root[data-tema="claro"] {
  --bg: #EEF0F3; --surface: #FFFFFF; --surface-2: #F7F8FA; --surface-3: #E8EBEF;
  --border: #E3E5E9; --border-strong: #D3D7DD;
  --text: #2F3237; --text-2: #5F646B; --text-3: #90959C;
  --acc: #49619C; --acc-strong: #3C5184;
  --acc-hover: #F2F5FC; --acc-sel: #E1E7F5; --acc-line: #C1CDE9; --acc-on: #263353; --on-acc: #FFFFFF;
  --s1: #49619C; --s2: #8EA2D0; --s3: #C1CDE9;
  --danger: #C0392B; --danger-soft: #FBECEA;
  --warn: #B4761A; --warn-soft: #FDF3E3; --warn-line: #F3DDB5; --ok: #22885B; --ok-soft: #E8F6EF;
  --sh-1: 0 1px 2px rgba(24, 26, 28, .06); --sh-drawer: 0 20px 46px rgba(24, 26, 28, .22); --scrim: rgba(16, 17, 19, .38);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

/* Rolagem quase invisível: fina, sem trilho e sem setas; o polegar aparece só com o ponteiro sobre a área */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*:hover { scrollbar-color: color-mix(in srgb, var(--text) 18%, transparent) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-button { background: transparent; display: none; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
*:hover::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 18%, transparent); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/20px var(--font-body);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }

/* Aplicação: a moldura ocupa a janela inteira */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  padding: var(--gap) max(var(--gap), env(safe-area-inset-right, 0px)) var(--gap) max(var(--gap), env(safe-area-inset-left, 0px));
}

/* A instalação de demonstração é contexto da conta: fica junto da empresa, no rodapé do submenu */
.demo {
  flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: center;
  margin-top: 6px; padding: 8px 10px;
  border: 1px solid var(--warn-line); border-radius: var(--radius); background: var(--warn-soft);
  font-size: 12px; line-height: 16px; color: var(--text-2);
}
.demo svg { grid-row: span 2; color: var(--warn); }
.demo strong { color: var(--text); font-weight: 600; }
.avatar.demo-dot { position: relative; }
.avatar.demo-dot::after {
  content: ""; position: absolute; top: -2px; right: -2px; width: 9px; height: 9px;
  border: 2px solid var(--surface); border-radius: 50%; background: var(--warn);
}

.shell { position: relative; display: flex; min-height: 0; gap: 0; }
.nav { display: flex; flex: none; min-height: 0; }

.sheet {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--sh-1);
}

/* Trilho de módulos */
/* Acima da folha da página: a dica do módulo, com o submenu recolhido, passa por cima dela. */
.rail {
  flex: none; width: var(--rail);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 0 8px;
  z-index: 4;
}
.brand {
  display: grid; place-items: center; width: 36px; height: 36px; margin-bottom: 8px;
  border-radius: var(--radius); background: var(--acc); color: var(--on-acc);
}
.rail .grupo { display: grid; gap: 2px; }
.rail .spacer { flex: 1; }
.rail-btn {
  position: relative;
  display: grid; place-items: center; width: 38px; height: 38px;
  border: 0; border-radius: var(--radius); background: none; color: var(--text-2);
  transition: background 120ms, color 120ms;
}
.rail-btn:hover { background: var(--acc-hover); color: var(--acc); }
.rail-btn[aria-current="page"] { background: var(--acc-sel); color: var(--acc-on); }
.rail-btn[aria-pressed="true"] { color: var(--acc); }
.dica {
  position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
  padding: 4px 8px; border-radius: var(--radius); background: #26282A; color: #E9EAEB;
  font-size: 12px; line-height: 16px; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 120ms; z-index: 20;
}
.rail-btn:hover .dica, .rail-btn:focus-visible .dica { opacity: 1; }
.avatar {
  display: grid; place-items: center; width: 34px; height: 34px; margin-top: 6px; flex: none;
  border-radius: var(--radius); background: var(--acc-sel); color: var(--acc-on);
  font: 600 12px/1 var(--font-title);
}

/* Submenu do módulo, na base */
.panel {
  flex: none; width: var(--panel); min-height: 0; overflow: hidden;
  transition: width var(--speed) var(--ease), opacity var(--speed) var(--ease);
  z-index: 1;
}
.panel[data-aberto="false"] { width: 0; opacity: 0; }
/* O cabeçalho do submenu traz a marca, na altura do ícone da marca no trilho, e o primeiro item alinha com o primeiro módulo. */
.panel-inner { width: var(--panel); height: 100%; display: flex; flex-direction: column; padding: 11px 8px 4px 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; height: 36px; margin-bottom: 7px; flex: none; }
.panel-title { display: grid; line-height: 1.15; }
.panel-title strong { font: 600 17px/1.15 var(--font-title); color: var(--text); letter-spacing: -.01em; }
.panel-title span { color: var(--text-3); font-size: 11px; }
.panel-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 2px 4px; display: grid; align-content: start; gap: 2px; }
.icon-btn {
  display: grid; place-items: center; width: 32px; height: 32px; flex: none;
  border: 0; border-radius: var(--radius); background: none; color: var(--text-3);
}
.icon-btn:hover { background: var(--acc-hover); color: var(--acc); }
.icon-btn[aria-pressed="true"] { background: var(--acc-sel); color: var(--acc-on); }
.item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 8px;
  border: 1px solid transparent; border-radius: var(--radius); background: none;
  color: var(--text-2); font-weight: 600; font-size: 13px; text-align: left; text-decoration: none;
  transition: background 120ms, color 120ms;
}
.item:hover { background: var(--acc-hover); color: var(--acc-on); }
.item:hover svg { color: var(--acc); }
.item .chev { margin-left: auto; display: inline-flex; color: var(--text-3); transition: transform var(--speed) var(--ease); }
.item[aria-expanded="true"] .chev { transform: rotate(90deg); }
.item[aria-current="page"] { background: var(--acc-sel); border-color: var(--acc-line); box-shadow: var(--sh-1); color: var(--acc-on); }
.item[aria-current="page"] svg { color: var(--acc); }
.item.trilha { color: var(--acc-on); }
.item.trilha > svg { color: var(--acc); }
.sub { margin: 2px 0 4px 16px; padding-left: 9px; border-left: 1px solid var(--border-strong); display: grid; gap: 2px; }
.sub .item { height: 30px; font-weight: 400; }
.sub .item[aria-current="page"] { font-weight: 600; }
.panel-main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
.panel-foot { flex: none; padding: 6px 0 2px; margin-top: 6px; }
.panel-foot .avatar { margin: 0; }
.conta-trigger {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px;
  border: 0; border-radius: var(--radius); background: none; text-align: left;
}
.conta-trigger:hover, .conta-trigger[aria-expanded="true"] { background: var(--acc-hover); }
.conta-trigger .chev { margin-left: auto; display: inline-flex; color: var(--text-3); transition: transform var(--speed) var(--ease); }
.conta-trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* Conta do usuário: cresce de baixo para cima acima do rodapé, na altura das opções, e encolhe a lista do módulo */
.conta {
  flex: none; display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--speed) var(--ease);
}
.conta[data-aberto="true"] { grid-template-rows: 1fr; }
.conta > nav {
  min-height: 0; overflow: hidden;
  transform: translateY(24px); opacity: 0;
  transition: transform var(--speed) var(--ease), opacity var(--speed) var(--ease);
}
.conta[data-aberto="true"] > nav { transform: none; opacity: 1; }
/* A conta abre num cartão próprio, para não se misturar com os itens do módulo. */
.conta > nav > div {
  margin-top: 8px; padding: 4px;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--sh-1);
}
.conta-rotulo { display: block; padding: 6px 8px 4px; color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.conta-head { display: flex; align-items: center; gap: 10px; padding: 4px 4px 12px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
.conta-head .logo { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: var(--radius); background: var(--acc); color: var(--on-acc); }
.conta-head div:last-child { display: grid; min-width: 0; line-height: 1.3; }
.conta-head strong { font-size: 13px; }
.conta-head span { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conta ul { display: grid; gap: 2px; }
.conta .count {
  margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: var(--radius);
  background: var(--surface-3); color: var(--text-3); font-size: 11.5px; font-weight: 600; text-align: center;
}
.conta .count + .chev { margin-left: 4px; }
.conta hr { width: 100%; margin: 6px 0; border: 0; border-top: 1px solid var(--border); }
.rail .avatar { border: 0; padding: 0; }
.rail .avatar:hover { background: var(--acc-line); }
.who { display: grid; min-width: 0; line-height: 1.3; }
.who strong { font-size: 12.5px; font-weight: 600; }
.who span { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-foot .icon-btn { margin-left: auto; }

/* Folha da página */
.page {
  flex: 1; min-width: 0; min-height: 0;
  margin-left: var(--gap);
  display: flex; flex-direction: column; overflow: hidden;
  z-index: 2;
}
.page-bar {
  flex: none; display: flex; align-items: center; gap: 6px;
  height: 46px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border);
}
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; color: var(--text-3); font-weight: 600; white-space: nowrap; overflow: hidden; }
.crumbs .now { color: var(--text); background: var(--surface-3); padding: 2px 8px; border-radius: var(--radius); }
.updated { margin-left: auto; color: var(--text-3); font-size: 12px; white-space: nowrap; padding: 0 6px; }
.page-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 22px; container-type: inline-size; }
/* O cabeçalho da página se separa do conteúdo por uma linha de borda a borda da folha */
.page-head {
  display: grid; gap: 4px; margin: -18px -18px 16px; padding: 18px 18px 16px; border-bottom: 1px solid var(--border);
  padding-inline: max(18px, calc((100% + 36px - var(--lim)) / 2));
}

/* Três larguras de conteúdo: total (índice, painel), larga (1120) e estreita (760). O cabeçalho acompanha a coluna. */
.page-body { --lim: 99999px; }
.lim { max-width: var(--lim); margin-inline: auto; }
.page-head.com-busca { grid-template-columns: minmax(0, 1fr) minmax(200px, 320px); align-items: center; column-gap: 24px; }
.page-head.com-busca > :not(.busca) { grid-column: 1; }
.busca {
  grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text-3);
}
.busca input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; color: var(--text); }
.busca:focus-within { border-color: var(--acc); }

/* Índice de configurações: grupos em cartão, cada item com o estado dele */
.indice { display: grid; gap: 14px; }
.grupo-card h2 { padding: 12px 16px; border-bottom: 1px solid var(--border); font: 600 15px/22px var(--font-body); }
.grupo-card ul { padding: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px; }
.link-config { display: grid; gap: 1px; padding: 9px 10px; border-radius: var(--radius); color: var(--text); text-decoration: none; }
.link-config:hover { background: var(--acc-hover); }
.link-config:hover strong { color: var(--acc-on); }
.link-config strong { font-size: 13.5px; font-weight: 600; }
.link-config span { font-size: 12.5px; color: var(--text-2); }
.link-config .alerta { color: var(--danger); font-weight: 600; }
.sem-resultado { padding: 32px; text-align: center; color: var(--text-2); }

/* Seção de configuração: cartões com linhas de ajuste e um salvar por cartão */
.stack { display: grid; gap: 14px; }
.sec { overflow: hidden; }
.sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sec-head h2, .nota h2 { font: 600 15px/22px var(--font-body); }
.sec-head p, .nota p { font-size: 13px; color: var(--text-2); }
.sec-head.so-acao { justify-content: flex-end; padding-block: 8px; }
.ajuste { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.ajuste:last-child { border-bottom: 0; }
.ajuste .txt { flex: 1 1 260px; min-width: 0; display: grid; gap: 1px; }
.ajuste .txt label, .ajuste .txt strong { font-weight: 600; font-size: 13.5px; }
.ajuste .txt p { font-size: 12.5px; color: var(--text-2); }
.num { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.num input {
  width: 76px; height: 36px; padding: 0 10px; text-align: right;
  border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
  font-variant-numeric: tabular-nums;
}
.num input:focus { outline: 0; border-color: var(--acc); }
.sec-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface-2); }
.sec-foot .situacao { margin-right: auto; font-size: 12.5px; color: var(--text-3); }
.sec-foot .situacao.pendente { color: var(--warn); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: none; color: var(--acc); }
.btn.ghost:hover { background: var(--acc-hover); color: var(--acc-on); }
.pessoa { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.pessoa:last-child { border-bottom: 0; }
.pessoa .avatar { margin: 0; }
.pessoa .who strong { font-size: 13.5px; }
.pessoa .who span { font-size: 12.5px; }
.pessoa .limite { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.sec.perigo { border-color: color-mix(in srgb, var(--danger) 35%, var(--surface)); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--surface)); }
.btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.selo { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: var(--radius); font-size: 12px; font-weight: 600; background: var(--ok-soft); color: var(--ok); }
.selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* Arranjo anotado: título e explicação à esquerda, o cartão à direita */
.anotado { display: grid; }
.anotado .linha { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: 12px 32px; padding-block: 20px; border-bottom: 1px solid var(--border); }
.anotado .linha:first-child { padding-top: 4px; }
.anotado .linha:last-child { border-bottom: 0; }
.nota { display: grid; align-content: start; gap: 4px; }
.nota .btn { justify-self: start; margin-top: 6px; }

/* Arranjo com índice da página: os cartões e, ao lado, os atalhos para cada um */
.com-indice { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 32px; align-items: start; }
.toc { position: sticky; top: 0; display: grid; gap: 2px; }
.toc > span { padding: 0 8px 6px; color: var(--text-3); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.toc a { display: block; padding: 6px 8px; border-left: 0; border-radius: var(--radius); color: var(--text-2); font-size: 13px; text-decoration: none; }
.toc a:hover { background: var(--acc-hover); color: var(--acc-on); }
.toc a[aria-current="true"] { background: var(--acc-sel); color: var(--acc-on); font-weight: 600; }

@container (max-width: 820px) {
  .anotado .linha { grid-template-columns: minmax(0, 1fr); }
  .com-indice { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  .page-head.com-busca { grid-template-columns: minmax(0, 1fr); }
  .busca { grid-column: 1; grid-row: auto; }
}

/* Painel do estudo: troca o arranjo da seção. Não faz parte do modelo. */
.estudo {
  position: fixed; z-index: 40;
  right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 6px; padding: 10px 12px;
  border: 1px dashed var(--acc-line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--sh-drawer);
  font-size: 12px;
}
.estudo > span { color: var(--text-3); font-weight: 600; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius); }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text-2); font-size: 12px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--acc-sel); color: var(--acc-on); }
.page-head h1 { font: 600 24px/32px var(--font-title); text-wrap: balance; }
.page-head p { color: var(--text-2); }
.chip {
  justify-self: start; margin-top: 4px; padding: 2px 10px;
  border: 1px solid var(--acc-line); border-radius: var(--radius); background: var(--acc-hover);
  color: var(--acc-on); font-size: 12px; font-weight: 600;
}

/* Grade do dashboard, medida pela largura da folha */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.s3 { grid-column: span 3; }
.s4 { grid-column: span 4; }
.s6 { grid-column: span 6; }
@container (max-width: 1060px) {
  .s3, .s4 { grid-column: span 6; }
  .s4.fecha { grid-column: span 12; }
}
@container (max-width: 680px) {
  .s3, .s4, .s6, .s4.fecha { grid-column: span 12; }
}

.card { display: flex; flex-direction: column; min-width: 0; padding: 16px; }
.card-head { display: grid; gap: 2px; }
.card-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card-title h3 { font: 600 16px/24px var(--font-body); color: var(--text); }
.ai { width: 26px; height: 26px; color: var(--text-3); }
.trend {
  margin-left: auto; display: inline-flex; align-items: center; gap: 4px; flex: none;
  padding: 1px 8px; border-radius: var(--radius);
  background: var(--danger-soft); color: var(--danger); font-size: 12px; font-weight: 600;
}
.card-head p { color: var(--text-2); }
.metric { min-height: 150px; }
.metric .value { margin-top: auto; padding-top: 16px; font: 600 36px/44px var(--font-title); color: var(--text); font-variant-numeric: tabular-nums; }
.metric .value small { font: 400 14px/20px var(--font-body); color: var(--text-3); margin-left: 6px; }

/* Barras horizontais */
.bars { margin-top: 14px; display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: var(--label, 32px) minmax(0, 1fr); align-items: center; gap: 10px; }
.bar-label { color: var(--text-2); font-size: 12px; line-height: 16px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track {
  position: relative; display: flex; align-items: center; gap: 6px; height: var(--row, 16px);
  background-image: linear-gradient(to right, var(--border) 1px, transparent 1px);
  background-size: calc((100% - 44px) / 4) 100%;
  background-repeat: repeat-y;
}
.bar { height: var(--thick, 10px); min-width: 2px; border-radius: 2px; background: var(--s1); }
.bar-val { color: var(--text-2); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-row.clicavel { cursor: pointer; border-radius: 4px; }
.bar-row.clicavel:hover .bar { background: var(--acc-strong); }
.bar-row.clicavel:hover .bar-label { color: var(--acc-on); }

/* Rosca com a legenda encostada na forma */
.donut-body { flex: 1; display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
.donut { flex: none; width: 168px; height: 168px; }
.donut .total { font: 600 22px/1 var(--font-title); fill: var(--text); }
.donut .total-label { font: 400 12px/1 var(--font-body); fill: var(--text-3); }
.legend { display: grid; gap: 8px; min-width: 0; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, auto) auto; align-items: center; gap: 8px 10px; font-size: 13px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; }
.legend .nome { color: var(--text-2); }
.legend .pct { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

.empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 64px 16px; color: var(--text-2); }
.empty strong { color: var(--text); font: 600 16px/24px var(--font-body); }

/* Filtros: na base, à direita, empurrando a página como o submenu */
.aside {
  flex: none; width: var(--aside); min-height: 0; overflow: hidden;
  transition: width var(--speed) var(--ease), opacity var(--speed) var(--ease);
}
.aside[data-aberto="false"] { width: 0; opacity: 0; }
.aside-inner { width: var(--aside); height: 100%; display: flex; flex-direction: column; padding: 4px 6px 0 14px; }
.aside-head { display: flex; align-items: center; justify-content: space-between; height: 46px; flex: none; }
.aside-head strong { font: 600 15px/1.2 var(--font-title); }
.aside-body { flex: 1; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 14px; padding: 4px 2px 12px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.field label i { font-style: normal; color: var(--danger); }
.select {
  width: 100%; height: 38px; padding: 0 30px 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
  appearance: none; font-size: 13px; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
.aside-foot { flex: none; display: grid; gap: 10px; padding: 12px 2px 4px; border-top: 1px solid var(--border); }
.switch-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
.switch-row span { display: grid; line-height: 1.3; }
.switch-row small { color: var(--text-3); font-size: 11.5px; }
.switch {
  appearance: none; margin: 0 0 0 auto; flex: none; width: 34px; height: 20px; border-radius: 999px;
  background: var(--border-strong); position: relative; cursor: pointer; transition: background 120ms;
}
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform 120ms; }
.switch:checked { background: var(--acc); }
.switch:checked::after { transform: translateX(14px); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
  color: var(--text); font-size: 13px; font-weight: 600;
}
.btn:hover { background: var(--acc-hover); border-color: var(--acc-line); color: var(--acc-on); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.btn.primary:hover { background: var(--acc-strong); border-color: var(--acc-strong); }
.btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.scrim { position: absolute; inset: 0; z-index: 5; border-radius: var(--radius); background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--speed); }
#menu { display: none; }

/* Estreito: trilho e submenu numa gaveta à esquerda, filtros numa gaveta à direita */
@media (max-width: 900px) {
  #menu { display: grid; }
  #expandir { display: none !important; }
  .updated { display: none; }
  .nav {
    position: absolute; inset: 0 auto 0 0; z-index: 6;
    padding: var(--gap); border-radius: var(--radius);
    background: var(--bg); box-shadow: var(--sh-drawer);
    transform: translateX(calc(-100% - 40px)); transition: transform var(--speed) var(--ease);
  }
  .shell[data-menu="aberto"] .nav { transform: none; }
  .nav .panel[data-aberto] { width: var(--panel); opacity: 1; }
  .page { margin-left: 0; }
  .aside, .aside[data-aberto] {
    position: absolute; inset: 0 0 0 auto; z-index: 6; width: min(var(--aside), calc(100% - 48px)); opacity: 1;
    border-radius: var(--radius); background: var(--bg); box-shadow: var(--sh-drawer);
    transform: translateX(calc(100% + 40px)); transition: transform var(--speed) var(--ease);
  }
  .aside[data-aberto="true"] { transform: none; }
  .aside-inner { width: 100%; }
  .shell[data-menu="aberto"] .scrim, .shell[data-filtros="aberto"] .scrim { opacity: 1; pointer-events: auto; }
  .page-body { padding: 14px 12px 18px; }
  .page-head h1 { font-size: 20px; line-height: 28px; }
  .page-head { margin: -14px -12px 14px; padding: 14px 12px; padding-inline: max(12px, calc((100% + 24px - var(--lim)) / 2)); }
  .estudo { left: calc(12px + env(safe-area-inset-left, 0px)); right: auto; }
}

@media (prefers-reduced-motion: reduce) {
  .panel, .aside, .nav, .scrim, .item .chev, .rail-btn, .item { transition: none; }
}
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ===== Composições: peças comuns ===== */
.mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-weight: 500; font-size: .94em; font-variant-numeric: tabular-nums; }
.num-r { text-align: right; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
a { color: var(--acc); }

/* Selo da composição, só do protótipo */
.comp {
  justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px;
  border: 1px dashed var(--acc-line); border-radius: var(--radius); color: var(--text-3); font-size: 11.5px; font-weight: 600;
}
.comp b { color: var(--acc-on); font-weight: 600; }
.meta-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 2px; }

/* Cabeçalho com ações */
.page-head .topo { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
.page-head .topo > .titulo { min-width: 0; flex: 1 1 320px; display: grid; gap: 4px; }
.page-head .titulo-linha { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.voltar { margin-left: -8px; }

/* Selos de situação em quatro tons */
.selo.ok { background: var(--ok-soft); color: var(--ok); }
.selo.warn { background: var(--warn-soft); color: var(--warn); }
.selo.danger { background: var(--danger-soft); color: var(--danger); }
.selo.info { background: var(--acc-sel); color: var(--acc-on); }
.selo.neutral { background: var(--surface-3); color: var(--text-2); }
.selo { white-space: nowrap; }

/* Botões e campos */
.btn { white-space: nowrap; }
.btn.sm svg { flex: none; }
.btn.link { height: auto; padding: 0; border: 0; background: none; color: var(--acc); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn.link:hover { background: none; color: var(--acc-strong); }
.input, .textarea {
  width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius);
  background: var(--surface); font-size: 13px;
}
.textarea { height: auto; min-height: 84px; padding: 9px 10px; resize: vertical; }
.input:focus, .textarea:focus, .select:focus { outline: 0; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-hover); }
.input.sm { height: 32px; font-size: 12.5px; }
.field small { color: var(--text-3); font-size: 12px; }
input[type="checkbox"]:not(.switch), input[type="radio"] { accent-color: var(--acc); width: 16px; height: 16px; margin: 0; }
.fgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; padding: 16px; }
.fgrid.dois { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[hidden] { display: none !important; }
.c1 { grid-column: span 1; } .c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
.fgrid.dois .c2, .fgrid.dois .c3, .fgrid.dois .c4 { grid-column: span 1; }
.fgrid.dois .c6 { grid-column: span 2; }
.fgrid .field { align-content: start; }
@container (max-width: 700px) {
  .fgrid, .fgrid.dois { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .c2, .c3, .c4 { grid-column: span 1; } .c6 { grid-column: span 2; }
}
@container (max-width: 460px) {
  .fgrid, .fgrid.dois { grid-template-columns: minmax(0, 1fr); }
  .c2, .c3, .c4, .c6, .fgrid.dois .c6 { grid-column: span 1; }
}
.seg.cheio { display: flex; } .seg.cheio button { flex: 1; }

/* Cartões e listas de descrição */
.cartao { overflow: hidden; }
.cartao > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.cartao > header h2 { font: 600 15px/22px var(--font-body); }
.cartao > header p { font-size: 13px; color: var(--text-2); }
.cartao > .corpo { padding: 16px; }
.cartao > footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface-2); }
.duas { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.coluna { display: grid; gap: 14px; min-width: 0; }
@container (max-width: 860px) { .duas { grid-template-columns: minmax(0, 1fr); } }
.dl { display: grid; gap: 10px; margin: 0; }
.dl > div { display: grid; gap: 1px; }
.dl dt { font-size: 12px; color: var(--text-3); font-weight: 600; }
.dl dd { margin: 0; font-size: 13.5px; }
.totais { display: grid; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface-2); }
.totais > div { display: flex; justify-content: space-between; gap: 12px; color: var(--text-2); font-size: 13px; }
.totais > div.total { padding-top: 8px; border-top: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 15px; }
.totais .total .mono { font-size: 17px; }

/* Tabela de dados: vira lista de cartões em largura estreita */
.tabela-wrap { overflow-x: auto; }
table.dados { width: 100%; border-collapse: collapse; }
.dados th {
  padding: 0 12px; height: 38px; border-bottom: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-3); font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap;
}
.dados td { padding: 0 12px; height: 46px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.dados tbody tr:last-child td { border-bottom: 0; }
.dados tbody tr:hover { background: var(--acc-hover); }
.dados tr.selecionada, .dados tr.selecionada:hover { background: var(--acc-sel); }
.dados .sel { width: 40px; padding-right: 0; }
.dados td.r, .dados th.r { text-align: right; }
.dados th .ord {
  display: inline-flex; align-items: center; gap: 4px; height: 100%; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; }
.dados th .ord:hover { color: var(--acc-on); }
.dados th[aria-sort="ascending"] .ord, .dados th[aria-sort="descending"] .ord { color: var(--acc-on); }
.dados th .seta { opacity: .35; display: inline-flex; }
.dados th[aria-sort] .seta { opacity: 1; }
.dados th[aria-sort="ascending"] .seta { transform: rotate(180deg); }
.dados td a.id { font-weight: 600; text-decoration: none; }
.dados td a.id:hover { text-decoration: underline; }
.dados tr.clicavel { cursor: pointer; }
.dados td .sub { display: block; font-size: 12px; color: var(--text-3); }
.dados .entrada td { background: var(--acc-hover); height: 52px; }
.dados .entrada .input { height: 32px; font-size: 12.5px; }
.dados .novo-selo { margin-left: 6px; }
.dados tfoot td { background: var(--surface-2); }
@container (max-width: 720px) {
  .tabela-wrap { overflow: visible; }
  .dados thead { display: none; }
  .dados, .dados tbody { display: block; }
  .dados tbody tr { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 12px 44px 12px 14px; border-bottom: 1px solid var(--border); }
  .dados tbody tr:last-child { border-bottom: 0; }
  .dados td { display: block; height: auto; padding: 0; border: 0; text-align: left; min-width: 0; }
  .dados td.r { text-align: left; }
  .dados td[data-l]::before { content: attr(data-l); display: block; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .dados td.principal { grid-column: span 2; }
  .dados td.sel { position: absolute; top: 12px; right: 12px; width: auto; }
  .dados .entrada td { grid-column: span 2; }
}

/* Ferramentas da tabela */
.ferr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; }
.ferr .busca { grid-column: auto; grid-row: auto; flex: 1 1 220px; max-width: 360px; height: 36px; }
.ferr .fim { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.contagem { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--acc); color: var(--on-acc); font-size: 11px; line-height: 18px; text-align: center; }
.abas { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.aba {
  display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent;
  background: none; color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap;
}
.aba:hover { color: var(--acc-on); background: var(--acc-hover); }
.aba[aria-selected="true"] { color: var(--acc-on); border-bottom-color: var(--acc); }
.aba .n { padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 11.5px; line-height: 18px; }
.aba[aria-selected="true"] .n { background: var(--acc-sel); color: var(--acc-on); }
.lote {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--acc-sel); border-bottom: 1px solid var(--acc-line); color: var(--acc-on); font-weight: 600; font-size: 13px;
}
.lote .acoes { margin-left: auto; }
.pag { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border-top: 1px solid var(--border); color: var(--text-2); font-size: 12.5px; }
.pag nav { display: flex; gap: 4px; }
.pag button { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--radius); background: none; color: var(--text-2); font-weight: 600; font-size: 12.5px; }
.pag button:hover:not(:disabled) { background: var(--acc-hover); color: var(--acc-on); }
.pag button[aria-current="page"] { background: var(--acc-sel); border-color: var(--acc-line); color: var(--acc-on); }
.pag button:disabled { opacity: .4; cursor: not-allowed; }

/* Esqueleto de carregamento */
.sk-linha { display: flex; align-items: center; gap: 16px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.sk { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%); background-size: 200% 100%; animation: brilho 1.2s linear infinite; }
@keyframes brilho { to { background-position: -200% 0; } }

/* Alerta, vazio, passos */
.alerta-bloco { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border: 1px solid var(--warn-line); border-radius: var(--radius); background: var(--warn-soft); font-size: 13px; }
.alerta-bloco svg { flex: none; margin-top: 1px; color: var(--warn); }
.alerta-bloco.info { border-color: var(--acc-line); background: var(--acc-hover); }
.alerta-bloco.info svg { color: var(--acc); }
.alerta-bloco strong { display: block; }
.alerta-bloco p { color: var(--text-2); }
.alerta-bloco .btn.link { margin-top: 2px; }
.vazio-grande { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 40px 20px 28px; }
.vazio-grande .icone { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--acc-sel); color: var(--acc); }
.vazio-grande h2 { font: 600 18px/26px var(--font-title); }

.passos strong { font-size: 13.5px; } .passos span { font-size: 12.5px; color: var(--text-2); }
@container (max-width: 640px) { .passos { grid-template-columns: minmax(0, 1fr); } }
.steps { display: flex; gap: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); counter-reset: s; }
.step { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; position: relative; padding: 0; border: 0; background: none; text-align: left; color: var(--text-3); font-size: 13px; font-weight: 600; }
.step:not(:last-child)::after { content: ""; flex: 1; height: 2px; margin: 0 10px; border-radius: 2px; background: var(--border-strong); min-width: 12px; }
.step.feito:not(:last-child)::after { background: var(--acc); }
.step .bola { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--surface); font-size: 12px; }
.step.feito .bola { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.step.atual .bola { border-color: var(--acc); color: var(--acc-on); background: var(--acc-sel); }
.step.atual, .step.feito { color: var(--text); }
.step .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step:disabled { cursor: default; }
@container (max-width: 720px) {
  .steps { gap: 8px; }
  .step:not(.atual) { flex: 0 0 auto; } .step:not(.atual) .nome { display: none; } .step.atual { flex: 1 1 auto; }
  .step:not(:last-child)::after { display: none; }
  .abas { flex-wrap: wrap; overflow: visible; }

/* Linha do tempo */

.tempo li::after { content: ""; position: absolute; left: 8px; top: 26px; bottom: -8px; width: 1px; background: var(--border-strong); }
.tempo li:last-child::after { display: none; }
.tempo li.comentario::before { background: var(--surface); border: 2px solid var(--acc); box-shadow: none; width: 9px; height: 9px; }

function barras(dados, { label = '32px', row = '16px', thick = '10px', clicavel = false, nome } = {}) {
  const max = Math.max(...dados.map((d) => d[1]));
  const linhas = dados.map(([r, v]) => `<li class="bar-row ${clicavel ? 'clicavel' : ''}">
      <span class="bar-label" title="${r}">${r}</span>
      <span class="bar-track"><span class="bar" style="width:calc((100% - 44px) * ${v / max})"></span><span class="bar-val">${nf.format(v)}</span></span></li>`).join('');
  return `<ul class="bars" style="--label:${label};--row:${row};--thick:${thick}" aria-label="${nome}">${linhas}</ul>`;
}

function rosca(dados, total, cores) {
  const r = 62, c = 2 * Math.PI * r, folga = 3;
  let acc = 0;
  const arcos = dados.map(([, v], i) => {
    const len = (v / total) * c;
    const arco = `<circle cx="84" cy="84" r="${r}" fill="none" stroke="${cores[i]}" stroke-width="24"
      stroke-dasharray="${Math.max(len - folga, 0)} ${c}" stroke-dashoffset="${-acc}" transform="rotate(-90 84 84)"/>`;
    acc += len;
    return arco;
  }).join('');
  const legenda = dados.map(([n, v], i) => `<li><span class="dot" style="background:${cores[i]}"></span><span class="nome">${n}</span><span class="pct">${Math.round((v / total) * 100)}%</span></li>`).join('');
  return `<div class="donut-body">
    <svg class="donut" viewBox="0 0 168 168" role="img" aria-label="${dados.map(([n, v]) => `${n}: ${nf.format(v)}`).join(', ')}">
      ${arcos}<text class="total" x="84" y="86" text-anchor="middle">${nf.format(total)}</text>
      <text class="total-label" x="84" y="106" text-anchor="middle">Total</text></svg>
    <ul class="legend">${legenda}</ul></div>`;
}

function cartaoSecao(s, comTitulo) {
  const acao = s.acao ? `<button type="button" class="btn sm ghost">${ic('mais', 15, 2)}${s.acao}</button>` : '';

    ? `<header class="sec-head"><div><h2 id="t-${s.id}">${s.titulo}</h2><p>${s.desc}</p></div>${acao}</header>`
    : '';
  const corpo = s.salvar ? `<form id="f-${s.id}" data-salvavel>${s.corpo()}</form>` : s.corpo();

      <button type="submit" form="f-${s.id}" class="btn sm primary" disabled>${s.salvar}</button></footer>` : '';

function secaoDescontos() {
  const a = estado.arranjo;

    conteudo = `<div class="com-indice"><div class="stack">${SECOES.map((s) => cartaoSecao(s, true)).join('')}</div>
      <nav class="toc" aria-label="Nesta página"><span>Nesta página</span>

function marcarPendente(form, pendente, texto) {
  if (!form) return;
  const pe = form.closest('.sec').querySelector('.sec-foot');

const VISOES = [['todos', 'Todos'], ['aprovacao', 'Aguardando aprovação'], ['separacao', 'Em separação'], ['atrasado', 'Atrasados']];
const contarVisao = (v) => PEDIDOS.filter((p) => v === 'todos' || p.sit === v).length;
const totalFiltros = () => Object.values(estado.pedidos.filtro).filter(Boolean).length;
let temporizadorPedidos = null;

function pedidosFiltrados() {
  const e = estado.pedidos;
  const lista = PEDIDOS.filter((p) => (e.visao === 'todos' || p.sit === e.visao)
    && (!e.filtro.situacao || p.sit === e.filtro.situacao) && (!e.filtro.vendedor || p.vendedor === e.filtro.vendedor)
    && (!e.busca || `${p.cliente} ${p.numero}`.toLowerCase().includes(e.busca)));
  const { col, dir } = e.ordem;
  return lista.sort((a, b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (dir === 'asc' ? 1 : -1));
}

function pedidosIndice() {

function esqueleto(n = 8) {
  const larguras = [40, 180, 80, 100, 110, 70];
  return `<div role="status" aria-busy="true" aria-label="Carregando pedidos">${Array.from({ length: n }, () => `<div class="sk-linha">${larguras.map((l) => `<span class="sk" style="width:${l}px;max-width:30%"></span>`).join('')}</div>`).join('')}</div>`;
}

function areaPedidos() {
  const e = estado.pedidos;
  const lista = pedidosFiltrados();
  const paginas = Math.max(1, Math.ceil(lista.length / PEDIDOS_POR_PAGINA));
  e.pagina = Math.min(e.pagina, paginas);
  const ini = (e.pagina - 1) * PEDIDOS_POR_PAGINA;
  const pagina = lista.slice(ini, ini + PEDIDOS_POR_PAGINA);
  const th = (col, rotulo, cls = '') => {
    const ativo = e.ordem.col === col;
    return `<th scope="col" class="${cls}" ${ativo ? `aria-sort="${e.ordem.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}><button type="button" class="ord" data-ordenar="${col}">${rotulo}<span class="seta">${ic('seta', 14, 2)}</span></button></th>`;
  };
  const linhas = pagina.map((p) => {
    const marcado = e.sel.has(p.numero);
    return `<tr class="clicavel ${marcado ? 'selecionada' : ''}" data-linha="${p.numero}">
      <td class="sel"><input type="checkbox" data-sel="${p.numero}" aria-label="Selecionar pedido ${p.numero}" ${marcado ? 'checked' : ''}></td>
      <td class="principal"><a href="#" class="id mono" data-rota="pedido" data-param="${p.numero}">#${p.numero}</a></td>
      <td data-l="Cliente">${p.cliente}</td><td data-l="Data" class="mono">${dataBr(p.data)}</td><td data-l="Vendedor">${p.vendedor}</td>
      <td data-l="Situação">${seloSit(p.sit)}</td><td class="r mono" data-l="Total">${brl(p.total)}</td></tr>`;
  }).join('');
  const todas = pagina.length > 0 && pagina.every((p) => e.sel.has(p.numero));
  const algumas = pagina.some((p) => e.sel.has(p.numero));
  const lote = e.sel.size ? `<div class="lote" role="region" aria-label="Ações em lote"><span>${e.sel.size} ${e.sel.size === 1 ? 'pedido selecionado' : 'pedidos selecionados'}</span>
    <div class="acoes"><button type="button" class="btn sm" data-lote="aprovar">Aprovar</button><button type="button" class="btn sm" data-lote="exportar">Exportar</button>
      <button type="button" class="btn sm ghost" data-lote="limpar">Limpar seleção</button></div></div>` : '';
  const vazio = `<tr><td colspan="7" style="text-align:center;height:120px;color:var(--text-2)">Nenhum pedido com esses critérios. <button type="button" class="btn link" data-limpar-tudo>Limpar busca e filtros</button></td></tr>`;
  const botoesPagina = Array.from({ length: paginas }, (_, i) => `<button type="button" data-pagina="${i + 1}" data-numero ${i + 1 === e.pagina ? 'aria-current="page"' : ''} aria-label="Página ${i + 1}">${i + 1}</button>`).join('');
  return `${lote}<div class="tabela-wrap"><table class="dados" aria-label="Pedidos"><thead><tr>
      <th class="sel" scope="col"><input type="checkbox" data-sel-todas aria-label="Selecionar todos desta página" ${todas ? 'checked' : ''} data-parcial="${algumas && !todas}"></th>
      ${th('numero', 'Pedido')}${th('cliente', 'Cliente')}${th('data', 'Data')}<th scope="col">Vendedor</th><th scope="col">Situação</th>${th('total', 'Total', 'r')}</tr></thead>
    <tbody>${linhas || vazio}</tbody></table></div>
    <div class="pag"><span>${lista.length ? `Mostrando ${ini + 1}–${ini + pagina.length} de ${lista.length}` : 'Nenhum resultado'}</span>
      <nav aria-label="Paginação"><button type="button" data-pagina="${e.pagina - 1}" ${e.pagina === 1 ? 'disabled' : ''}>Anterior</button>${botoesPagina}
        <button type="button" data-pagina="${e.pagina + 1}" ${e.pagina === paginas ? 'disabled' : ''}>Próxima</button></nav></div>`;
}

function pintarPedidos({ comEsqueleto = false } = {}) {
  const area = document.getElementById('ped-area');
  if (!area) return;
  const e = estado.pedidos;
  document.getElementById('ped-tabs').innerHTML = VISOES.map(([k, n]) => `<button type="button" role="tab" class="aba" id="aba-${k}" data-visao="${k}" aria-selected="${e.visao === k}" tabindex="${e.visao === k ? 0 : -1}">${n}<span class="n">${contarVisao(k)}</span></button>`).join('');
  area.setAttribute('aria-labelledby', `aba-${e.visao}`);
  const n = totalFiltros();
  const contador = document.getElementById('ped-nfiltros');
  contador.hidden = !n; contador.textContent = n;
  clearTimeout(temporizadorPedidos);
  const montar = () => {
    area.innerHTML = areaPedidos();
    document.getElementById('ped-resumo').textContent = `${pedidosFiltrados().length} pedidos`;
    const parcial = area.querySelector('[data-parcial="true"]');
    if (parcial) parcial.indeterminate = true;
  };
  if (!comEsqueleto) { montar(); return; }
  area.innerHTML = esqueleto();
  temporizadorPedidos = setTimeout(montar, 650);
}

function filtrosPedidos() {
  const f = estado.pedidos.filtro;
  const opcoes = (lista, atual) => lista.map(([v, t]) => `<option value="${v}" ${v === atual ? 'selected' : ''}>${t}</option>`).join('');
  return `${campo('f-situacao', 'Situação', `<select class="select" id="f-situacao">${opcoes([['', 'Todas'], ...Object.entries(SITUACOES).map(([k, v]) => [k, v[0]])], f.situacao)}</select>`)}

function recalcularPedido() {
  let sub = 0;
  document.querySelectorAll('#np-itens [data-item]').forEach((tr) => {
    const preco = Number(tr.querySelector('[data-prod]').selectedOptions[0].dataset.preco);
    const qtd = Math.max(0, Number(tr.querySelector('[data-qtd]').value) || 0);
    tr.querySelector('[data-unit]').textContent = brl(preco);
    tr.querySelector('[data-total]').textContent = brl(preco * qtd);
    sub += preco * qtd;
  });
  const desconto = sub * ((Number(document.getElementById('np-desc').value) || 0) / 100);
  document.getElementById('np-sub').textContent = brl(sub);
  document.getElementById('np-d').textContent = `− ${brl(desconto)}`;
  document.getElementById('np-total').textContent = brl(sub - desconto);
  return sub - desconto;
}

function salvarNovoPedido() {
  const total = recalcularPedido();
  const maior = Math.max(...PEDIDOS.map((p) => p.numero));
  const descontoAlto = Number(document.getElementById('np-desc').value) > 5;
  PEDIDOS.unshift({ numero: maior + 1, cliente: document.getElementById('np-cliente').value || CLIENTES[0], vendedor: document.getElementById('np-vendedor').value,
    data: '2026-11-03', sit: descontoAlto ? 'aprovacao' : 'separacao', total });
  estado.pedidos.visao = 'todos';
  mostrarToast(`Pedido #${maior + 1} criado`);
  ir('pedidos');
}

function proximoSku() { return `P-${String(1000 + estado.produtos.length + 1)}`; }
function incluirProduto({ sku, descricao, un, preco, estoque, minimo }) {
  const novo = { sku: sku || proximoSku(), descricao, un: un || 'Un', preco: Number(String(preco).replace(',', '.')) || 0, estoque: Number(estoque) || 0, minimo: Number(minimo) || 0 };
  estado.produtos.unshift(novo);
  estado.novosSkus.add(novo.sku);
}

/* ================= 9. Conciliação: assistente ================= */
const ETAPAS = ['Conta e período', 'Extrato', 'Conferência', 'Revisão'];

function resumoConciliacao() {
  const c = estado.conc;
  const ok = LANCAMENTOS.filter((l, i) => l[3] === 'ok' || (l[3] === 'sug' && c.aceitos.has(i))).length;
  const sug = LANCAMENTOS.filter((l, i) => l[3] === 'sug' && !c.aceitos.has(i)).length;
  const sem = LANCAMENTOS.filter((l) => l[3] === 'sem').length;
  return { ok, sug, sem };
}

function conteudoEtapa() {
  const c = estado.conc;
  if (c.etapa === 0) {
    return `<div class="fgrid dois">${campo('c-conta', 'Conta bancária', selecao('c-conta', ['Banco do Brasil · ag. 3412, c/c 55871-4', 'Sicredi · ag. 0102, c/c 10233-9'], c.conta), { cls: 'c6', obrig: true })}
      ${campo('c-de', 'De', entrada('c-de', '01/10/2026'))}${campo('c-ate', 'Até', entrada('c-ate', '31/10/2026'))}</div>`;
  }
  if (c.etapa === 1) {
    const arquivo = c.arquivo
      ? `<div class="alerta-bloco info">${ic('okc', 18)}<div><strong>${c.arquivo === 'manual' ? 'Conferência manual escolhida' : 'extrato-outubro-2026.ofx'}</strong><p>${c.arquivo === 'manual' ? 'Os lançamentos serão digitados na próxima etapa.' : `${LANCAMENTOS.length} lançamentos lidos, de 01/10/2026 a 31/10/2026.`}</p></div></div>`
      : `<div class="vazio-grande" style="border:1px dashed var(--border-strong);border-radius:var(--radius);padding:28px 16px"><span class="icone">${ic('upload', 24)}</span><strong>Arquivo OFX do banco</strong><p>Baixe o extrato no internet banking, em formato OFX.</p>
        <button type="button" class="btn" data-escolher-arquivo>Escolher arquivo</button></div>`;
    return `<div class="stack">${arquivo}
      ${c.arquivo ? '' : alertaBloco('Sem o arquivo agora?', 'Dá para conferir os lançamentos à mão ou salvar o que foi feito e voltar depois.')}
      ${c.arquivo ? '' : `<div class="acoes"><button type="button" class="btn link" data-conc-manual>Conferir manualmente</button><button type="button" class="btn link" data-conc-sair>Salvar e continuar depois</button></div>`}</div>`;
  }
  if (c.etapa === 2) {
    const seloL = { ok: ['ok', 'Conciliado'], sug: ['info', 'Sugestão'], sem: ['warn', 'Sem par'] };
    const linhas = LANCAMENTOS.map(([d, t, v, s, par], i) => {
      const aceito = s === 'ok' || c.aceitos.has(i);
      return `<tr><td class="sel">${s === 'sug' ? `<input type="checkbox" data-aceitar="${i}" ${aceito ? 'checked' : ''} aria-label="Aceitar sugestão: ${t}">` : ''}</td>
        <td class="mono" data-l="Data">${d}</td><td class="principal">${t}${par ? `<span class="sub">${par}</span>` : ''}</td>
        <td class="r mono" data-l="Valor" style="color:${v < 0 ? 'var(--danger)' : 'inherit'}">${brl(v)}</td>
        <td data-l="Situação"><span class="selo ${aceito && s === 'sug' ? 'ok' : seloL[s][0]}">${aceito && s === 'sug' ? 'Aceito' : seloL[s][1]}</span></td></tr>`;
    }).join('');
    return `<div class="stack"><p class="muted">Marque as sugestões que estão certas. Lançamentos sem par ficam para ajuste depois.</p>
      <div class="sheet" style="overflow:hidden"><div class="tabela-wrap"><table class="dados" aria-label="Lançamentos do extrato"><thead><tr><th class="sel"><span class="vh">Aceitar</span></th><th scope="col">Data</th><th scope="col">Lançamento</th><th class="r" scope="col">Valor</th><th scope="col">Situação</th></tr></thead><tbody>${linhas}</tbody></table></div></div></div>`;
  }
  const r = resumoConciliacao();
  return `<div class="stack"><dl class="dl" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div><dt>Conta</dt><dd>${c.conta}</dd></div><div><dt>Período</dt><dd class="mono">01/10 a 31/10/2026</dd></div>
      <div><dt>Conciliados</dt><dd class="mono">${r.ok} de ${LANCAMENTOS.length}</dd></div></dl>
    ${r.sug ? alertaBloco(`${r.sug} ${r.sug === 1 ? 'sugestão' : 'sugestões'} sem resposta`, 'Voltar à conferência para aceitar ou deixar para depois.') : ''}
    ${r.sem ? alertaBloco(`${r.sem} ${r.sem === 1 ? 'lançamento' : 'lançamentos'} sem par`, 'Ficam na fila de ajuste e não travam a conclusão.', 'info') : ''}</div>`;
}

const TITULOS_ETAPA = [['Escolha a conta', 'Qual conta e qual período vão ser conferidos.'], ['Envie o extrato', 'O arquivo OFX traz os lançamentos do banco.'],
  ['Confira os lançamentos', 'Cada lançamento do banco é ligado a um pedido ou a uma conta.'], ['Revise e conclua', 'Veja o resultado antes de fechar o período.']];

function conciliacao() {
  const c = estado.conc;
  const cabecalhoC = cab({ titulo: 'Conciliação bancária', desc: 'Confira o extrato do banco com os pedidos e as contas do sistema.', comp: 'assistente em etapas' });
  if (c.concluida) {
    return `${cabecalhoC}<div class="lim"><section class="sheet cartao"><div class="vazio-grande"><span class="icone">${ic('okc', 28)}</span><h2>Conciliação de outubro concluída</h2>
      <p>${resumoConciliacao().ok} lançamentos conciliados. O que ficou sem par está na fila de ajuste.</p>
      <div class="acoes"><button type="button" class="btn" data-rota="inicio">Voltar à tela inicial</button><button type="button" class="btn" data-conc-reiniciar>Nova conciliação</button></div></div></section></div>`;
  }
  const passos = ETAPAS.map((n, i) => `<button type="button" class="step ${i < c.etapa ? 'feito' : i === c.etapa ? 'atual' : ''}" ${i < c.etapa ? `data-etapa="${i}"` : 'disabled'} ${i === c.etapa ? 'aria-current="step"' : ''}>
    <span class="bola">${i < c.etapa ? ic('check', 14, 2.4) : i + 1}</span><span class="nome">${n}</span></button>`).join('');

function aplicar({ conteudo = true } = {}) {
  const comFiltros = !!rotaAtual().filtros;

  if (!comFiltros) estado.filtros = false;
  const visivel = (estado.conta || modulo().itens.length > 0) && (estreito() || estado.aberto);
  $('#panel').dataset.aberto = String(visivel);
  $('#panel').inert = !visivel;
  $('#recolher').setAttribute('aria-expanded', String(visivel));
  $('#expandir').hidden = estreito() || visivel;
  $('#menu').setAttribute('aria-expanded', String(estado.menu));
  $('#nav').inert = estreito() && !estado.menu;
  shell.dataset.menu = estado.menu ? 'aberto' : 'fechado';

  $('#filtros').dataset.aberto = String(estado.filtros);
  $('#filtros').inert = !estado.filtros;
  $('#conta').dataset.aberto = String(estado.conta);
  $('#conta').inert = !estado.conta;
  $('#conta-trigger').setAttribute('aria-expanded', String(estado.conta));
  $('#rail-conta').setAttribute('aria-expanded', String(estado.conta && visivel));
  // Com o submenu aberto, a conta já está no rodapé dele: o avatar do trilho só aparece com o submenu recolhido.
  $('#rail-conta').hidden = visivel;

  sincronizarSavebar();
}

function abrirPopover(nome, gatilho) {
  fecharPopover(false);
  const p = $('#popover');
  p.innerHTML = POPS[nome].html();
  p.hidden = false;
  estado.popover = { nome, gatilho };
  gatilho.setAttribute('aria-expanded', 'true');
  const r = gatilho.getBoundingClientRect();
  const w = p.offsetWidth, h = p.offsetHeight;
  const esquerda = POPS[nome].alinhar === 'fim' ? r.right - w : r.left;
  let topo = r.bottom + 6;
  if (topo + h > innerHeight - 8) topo = Math.max(8, r.top - h - 6);
  p.style.left = `${Math.max(8, Math.min(esquerda, innerWidth - w - 8))}px`;
  p.style.top = `${topo}px`;
  p.setAttribute('aria-label', gatilho.textContent.trim());
  p.querySelector('input, button, select')?.focus();
}
function fecharPopover(devolverFoco = true) {
  if (!estado.popover) return;
  const { gatilho } = estado.popover;
  estado.popover = null;
  $('#popover').hidden = true;
  if (gatilho.isConnected) { gatilho.setAttribute('aria-expanded', 'false'); if (devolverFoco) gatilho.focus(); }
}
