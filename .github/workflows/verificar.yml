name: Verificar

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc -b

      - name: Rodar a suite
        run: npx vitest run

      - name: Construir
        run: npm run build

      - name: Conferir o pacote construido
        run: npm run check:pacote

      - name: Conferir o contraste dos tokens
        run: npm run check:contraste
