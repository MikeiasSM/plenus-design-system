name: Publicar no npm

# A publicacao e disparada pelo git: empurrar uma tag `vX.Y.Z` publica essa
# versao. Nada publica a partir de um commit solto na `main`.
on:
  push:
    tags:
      - 'v*'

# Duas tags empurradas juntas nao disputam o registro.
concurrency:
  group: publicar-npm
  cancel-in-progress: false

permissions:
  contents: read
  # A atestacao de procedencia assina com a identidade do fluxo.
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Historico inteiro, para conferir que a tag esta na `main`.
          fetch-depth: 0

      # A tag publica o que ja passou pela `main`; posta num commit solto, ela
      # levaria ao registro um codigo que ninguem integrou.
      - name: Conferir que a tag esta na main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME aponta para um commit fora da main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Escreve o `.npmrc` que o `npm publish` le, apontando para o registro
          # publico. O token entra por `NODE_AUTH_TOKEN`, mais abaixo.
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependencias
        run: npm ci

      # A tag e o `package.json` tem de dizer a mesma coisa. Sem esta comporta,
      # empurrar `v0.2.0` com o pacote em `0.1.1` publicaria a versao errada sob
      # um nome que promete outra.
      - name: Conferir que a tag corresponde a versao do pacote
        run: |
          versao=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$versao" != "$tag" ]; then
            echo "A tag $GITHUB_REF_NAME nao corresponde a versao $versao do package.json."
            exit 1
          fi
          echo "Publicando $versao."

      # Politica de versao do CONTRIBUTING, secao 11.
      - name: Conferir o CHANGELOG da versao
        run: |
          versao=$(node -p "require('./package.json').version")
          secao=$(awk -v cab="## [$versao]" 'index($0, cab) == 1 { dentro = 1; next } /^## \[/ { dentro = 0 } dentro' CHANGELOG.md)
          if ! grep -qF "## [$versao]" CHANGELOG.md; then
            echo "::error::O CHANGELOG.md nao tem a secao ## [$versao]."
            exit 1
          fi
          IFS=. read -r maior menor correcao <<< "${versao%%-*}"
          if echo "$secao" | grep -q '^### Incompat'; then
            if [ "$correcao" != 0 ] || { [ "$maior" != 0 ] && [ "$menor" != 0 ]; }; then
              echo "::error::A $versao traz mudanca incompativel: ela pede versao menor nova na serie 0.x, ou versao maior a partir da 1.0."
              exit 1
            fi
          fi

      - name: Verificar tipos
        run: npx tsc -b

      - name: Rodar a suite
        run: npx vitest run

      - name: Construir
        run: npm run build

      - name: Conferir o pacote construido
        run: npm run check:pacote

      - name: Conferir o contraste dos tokens
        run: npm run check:contraste

      # Falhar aqui, com o motivo escrito, vale mais do que falhar no `publish`
      # com um codigo de saida mudo.
      - name: Conferir a credencial
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::O segredo NPM_TOKEN chegou vazio."
            echo "Confira que ele esta em Settings > Secrets and variables > Actions,"
            echo "na aba **Secrets** e nao na aba **Variables**, com o nome exato NPM_TOKEN."
            exit 1
          fi
          # Fora da substituicao: dentro dela, a falha do `whoami` nao derrubava o passo.
          usuario=$(npm whoami)
          echo "Autenticado no npm como: $usuario"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # O pacote conferido vira o arquivo que sera publicado. Publicar a pasta
      # rodava o `prepare` e levava ao registro um build que ninguem conferiu.
      - name: Empacotar o build conferido
        run: echo "tarball=$(npm pack --ignore-scripts | tail -n 1)" >> "$GITHUB_OUTPUT"
        id: pacote

      # O token precisa ser **granular**, com escrita no escopo `@plenustech` e
      # a dispensa de 2FA marcada: o token classico exige o codigo de seis
      # digitos, que nenhuma automacao consegue responder.
      # A procedencia so existe para repositorio publico; no privado, pedi-la
      # derrubaria a publicacao.
      - name: Publicar
        run: npm publish "./${{ steps.pacote.outputs.tarball }}" ${{ !github.event.repository.private && '--provenance' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
